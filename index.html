<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caisse Calculator by otm05</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header>

        <div class="brand">
            <img src="assets/logo.png" alt="Logo">
            <div>
                <h1>Caisse Calculator</h1>
                <span>canada money</span>
            </div>
        </div>

        <button id="themeBtn">🌙</button>

    </header>


    <main>

        <section class="money-section">

            <h2>💵 Billets</h2>

            <div id="bills" class="cards"></div>


            <h2>🪙 Pièces</h2>

            <div id="Coins" class="cards"></div>

        </section>


        <section class="total-box">

            <p>TOTAL CASH</p>

            <h3>
                <span id="total">0.00</span>
            </h3>

            <button id="copyBtn">
                📋 Copy Total
            </button>


            <button id="resetBtn">
                🔄 Reset
            </button>

        </section>


    </main>

</div>
<footer>
    <span>Caisse Calculator Canada</span>
    <small>
        Designed & Developed by <b>otm05</b>
    </small>
</footer>

<script src="script.js"></script>

</body>
</html>
